name: Docker

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pvz-backend:ci

      - name: Create persistence volume
        run: docker volume create pvz-backend-smoke-data

      - name: Start backend
        run: |
          docker run -d             --name pvz-backend-smoke             -p 13000:3000             -v pvz-backend-smoke-data:/data             pvz-backend:ci

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' pvz-backend-smoke)"
            echo "health status: $status"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs pvz-backend-smoke
              exit 1
            fi

            sleep 1
          done

          docker logs pvz-backend-smoke
          echo "Container did not become healthy in time"
          exit 1

      - name: Smoke test API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:13000/api/health

      - name: Verify persistent data boundary
        run: |
          docker exec pvz-backend-smoke deno eval             --allow-read=/data             --allow-write=/data             'const db = await Deno.stat("/data/database.db"); if (!db.isFile) Deno.exit(1); await Deno.writeTextFile("/data/.smoke-persistence", "ok");'

      - name: Restart with the same volume
        run: |
          docker rm -f pvz-backend-smoke

          docker run -d             --name pvz-backend-smoke             -p 13000:3000             -v pvz-backend-smoke-data:/data             pvz-backend:ci

          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' pvz-backend-smoke)"
            echo "health status after restart: $status"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs pvz-backend-smoke
              exit 1
            fi

            sleep 1
          done

          docker logs pvz-backend-smoke
          echo "Container did not become healthy after restart"
          exit 1

      - name: Verify persistence after restart
        run: |
          docker exec pvz-backend-smoke deno eval             --allow-read=/data             'if ((await Deno.readTextFile("/data/.smoke-persistence")) !== "ok") Deno.exit(1);'

          curl --fail --silent --show-error http://127.0.0.1:13000/api/health

      - name: Container logs
        if: failure()
        run: docker logs pvz-backend-smoke || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pvz-backend-smoke >/dev/null 2>&1 || true
          docker volume rm pvz-backend-smoke-data >/dev/null 2>&1 || true
